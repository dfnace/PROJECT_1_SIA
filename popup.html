<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quiz Proctor</title>
  <style>
    body { width: 330px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .status { padding: 8px 10px; border-radius: 8px; background: #f3f4f6; margin-bottom: 10px; }
    .status.on { background: #dcfce7; }
    .warn { background: #fef3c7; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; display: none; }
    label { display: block; font-size: 12px; color: #374151; margin: 8px 0 2px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #9ca3af; border-radius: 6px; font: inherit; }
    button { margin-top: 8px; padding: 6px 12px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #111827; margin-left: 6px; }
    h2 { font-size: 13px; margin: 14px 0 4px; }
    ul { margin: 0; padding-left: 16px; max-height: 150px; overflow: auto; }
    li { margin-bottom: 3px; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <h1>Quiz Proctor</h1>
  <div id="status" class="status">Loading…</div>
  <div id="warnFile" class="warn">Tip: enable <b>Allow access to file URLs</b> for this extension on <code>chrome://extensions</code> so local-file activity is detected.</div>
  <div id="warnIncog" class="warn">Tip: enable <b>Allow in Incognito</b> so incognito windows are detected.</div>

  <label for="name">Full name</label>
  <input id="name" type="text" maxlength="80">
  <label for="sid">Student ID</label>
  <input id="sid" type="text" maxlength="40">
  <button id="save">Save</button>
  <button id="sync" class="secondary">Sync now</button>
  <small id="saved"></small>

  <h2>Recent flags (visible to you and your instructor)</h2>
  <ul id="recent"></ul>
  <small id="pending"></small>

  <script src="popup.js"></script>
</body>
</html>
